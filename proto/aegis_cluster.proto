// AEGIS Cluster Service Protocol
// gRPC service definition for inter-node communication in a distributed AEGIS cluster.
// Handles node attestation (two-step handshake), registration, heartbeat, execution
// routing/forwarding, config sync, peer discovery, and membership probes and
// fences (ADR-152).
//
// Port: 50056
// Auth: All RPCs except AttestNode and ChallengeNode require a SealNodeEnvelope
//       bearing a valid node_security_token issued by the controller.
syntax = "proto3";

package aegis.cluster.v1;

option java_multiple_files = true;
option java_package = "ai.hundredmonkeys.aegis.cluster.v1";
option java_outer_classname = "AegisClusterProto";
option go_package = "github.com/100monkeys-ai/aegis-proto/gen/go/cluster/v1;clusterv1";

import "google/protobuf/timestamp.proto";
import "google/protobuf/duration.proto";
import "google/protobuf/struct.proto";

// =============================================================================
// NodeClusterService
// Binds on port 50056.
// Implements the full lifecycle of a cluster node: attestation → registration →
// heartbeat → execution routing/forwarding → config sync → deregistration.
// =============================================================================

service NodeClusterService {
  // ── Handshake (unauthenticated) ────────────────────────────────────────────

  // Step 1 of node authentication handshake.
  // Node submits its Ed25519 public key and receives a challenge nonce.
  // No SealNodeEnvelope required — this is the bootstrap call.
  rpc AttestNode(AttestNodeRequest) returns (AttestNodeResponse);

  // Step 2 of node authentication handshake.
  // Node signs the challenge nonce with its private key; controller verifies
  // the signature and issues a NodeSecurityToken (RS256 JWT) on success.
  rpc ChallengeNode(ChallengeNodeRequest) returns (ChallengeNodeResponse);

  // ── Lifecycle (authenticated) ──────────────────────────────────────────────

  // Register a node's capabilities with the cluster controller.
  // Must be called after a successful ChallengeNode handshake.
  // payload: serialized RegisterNodeInner.
  rpc RegisterNode(RegisterNodeRequest) returns (RegisterNodeResponse);

  // Periodic liveness ping from a worker to the controller.
  // Response may carry zero or more pending NodeCommands (drain, config push,
  // shutdown) that the worker must process immediately.
  // payload: serialized NodeHeartbeatInner.
  rpc Heartbeat(NodeHeartbeatRequest) returns (NodeHeartbeatResponse);

  // Graceful shutdown notification from a worker to the controller.
  // Controller marks the node as draining and stops routing new executions to it.
  // payload: serialized DeregisterNodeInner.
  rpc DeregisterNode(DeregisterNodeRequest) returns (DeregisterNodeResponse);

  // ── Execution Routing & Forwarding (authenticated) ─────────────────────────

  // Client → Controller: select the best available worker for an execution.
  // Returns the target node ID and its gRPC address so the client can call
  // ForwardExecution directly on that worker.
  // payload: serialized RouteExecutionInner.
  rpc RouteExecution(RouteExecutionRequest) returns (RouteExecutionResponse);

  // Peer → peer (ADR-152 D5.3, D5.5): start an execution here because the
  // forwarding node is at capacity or draining. Answers once this node has
  // claimed it; its events reach the caller's node through the cluster event
  // relay. The caller is the forwarding node's signed assertion, never a
  // forwarded bearer token.
  // payload: serialized ForwardExecutionInner.
  rpc ForwardExecution(ForwardExecutionRequest) returns (ForwardExecutionResponse);

  // ── Config Sync (authenticated) ────────────────────────────────────────────

  // Worker → Controller: compare current config version and pull a delta if stale.
  // payload: serialized SyncConfigInner.
  rpc SyncConfig(SyncConfigRequest) returns (SyncConfigResponse);

  // Controller → Worker: push a config update proactively (e.g., after a change
  // that must be applied without waiting for the next heartbeat cycle).
  // payload: serialized PushConfigInner.
  rpc PushConfig(PushConfigRequest) returns (PushConfigResponse);

  // ── Cluster Introspection (authenticated, admin/operator) ─────────────────

  // List all nodes known to the cluster, with optional status/role filters.
  // Intended for operator tooling and The Synapse control plane UI.
  // payload: serialized ListPeersInner.
  rpc ListPeers(ListPeersRequest) returns (ListPeersResponse);

  // ── Edge Mode (ADR-117) ────────────────────────────────────────────────────

  // Bidirectional pull-based stream from an edge daemon to the controller or
  // Relay Coordinator. The first EdgeEvent on the stream MUST be EdgeEvent.Hello
  // carrying a SealNodeEnvelope; every subsequent message carries its own
  // SealNodeEnvelope per ADR-035 / ADR-059 discipline. The server uses the
  // long-lived stream to deliver EdgeCommand reverse-RPCs (InvokeTool, Cancel,
  // PushConfig, Drain, Shutdown) so daemons behind NAT remain reachable.
  // Activated for NODE_ROLE_CONTROLLER, NODE_ROLE_HYBRID, and
  // NODE_ROLE_RELAY_COORDINATOR.
  rpc ConnectEdge(stream EdgeEvent) returns (stream EdgeCommand);

  // Atomic Ed25519 key rotation for an enrolled edge daemon. The request
  // carries a SealNodeEnvelope signed by the *current* (old) key plus a
  // signature over a deterministic challenge using the *new* key — the
  // dual-signature requirement proves both authority (old key) and possession
  // (new key). Server atomically updates edge_daemons.public_key, blacklists
  // the prior NodeSecurityToken, issues a new one, and records both pubkeys
  // for the overlap window so the in-flight ConnectEdge stream survives.
  rpc RotateEdgeKey(RotateEdgeKeyRequest) returns (RotateEdgeKeyResponse);

  // ADR-117: SaaS deployment mints edge enrollment tokens here. Only the
  // relay-coordinator AppRole holds OpenBao policy
  // `transit/sign/edge-enrollment-token`. Auth: bearer JWT in `authorization`
  // metadata key (validated per-handler), tenant in `x-aegis-tenant`. Not a
  // SealNodeEnvelope — the principal is a human/service-account, not a node.
  rpc IssueEnrollmentToken(IssueEnrollmentTokenRequest)
      returns (IssueEnrollmentTokenResponse);

  // ── Membership (ADR-152 D1, D6) ────────────────────────────────────────────

  // Peer → peer over vRack, every second: is this node alive, which process
  // of it answers, and in what state. The lease in PostgreSQL decides
  // ownership; this probe is the second signal that decides death, and only
  // together with an expired lease (ADR-152 D1.4).
  // payload: serialized ProbeInner.
  rpc Probe(ProbeRequest) returns (ProbeResponse);

  // Peer → a DB-partitioned peer whose grace has run out (ADR-152 D6): stop
  // your work under the named incarnation and acknowledge, so that what you
  // own can be adopted without running twice. A node that is not the named
  // incarnation answers fenced = false and changes nothing.
  // payload: serialized FenceInner.
  rpc Fence(FenceRequest) returns (FenceResponse);

  // A cancel for an execution another node owns (AEGIS ADR-152 D5.4): the
  // node that received the cancel records it on the execution
  // (cancel_requested_at) and forwards it to the owner, whose supervisor
  // stops the run. An owner the forward does not reach still stops at its
  // run's next iteration boundary, where it reads the recorded request.
  rpc CancelExecution(CancelExecutionRequest) returns (CancelExecutionResponse);

  // Peer → peer, long-lived (AEGIS ADR-152 D3): the events of the relayed
  // categories this node originates, as it publishes them, each in an
  // envelope carrying its origin and a per-origin sequence. The subscriber
  // republishes them on its local bus with the envelope intact. A full
  // outbound queue closes the stream; the subscriber resynchronises from
  // execution_events and opens it again.
  // payload: serialized StreamClusterEventsInner.
  rpc StreamClusterEvents(StreamClusterEventsRequest) returns (stream ClusterEventEnvelope);

  // A tool call for an edge daemon whose stream another process holds
  // (AEGIS ADR-152 D8). A member's core sends it to the member whose Relay
  // Coordinator holds the stream (edge_stream_owners), over the members'
  // mutual TLS; that member's core sends it on to its own Relay Coordinator
  // over the pod network, which runs it on the stream. A process that holds
  // no stream for the edge answers FailedPrecondition ("edge unavailable"),
  // and the caller fails fast (ADR-117).
  // payload: serialized InvokeEdgeToolInner.
  rpc InvokeEdgeTool(InvokeEdgeToolRequest) returns (InvokeEdgeToolResponse);
}

// =============================================================================
// Security Envelope
// =============================================================================

// Outer security wrapper required on all authenticated node RPCs (analogous
// to SealEnvelope in the user-facing protocol, but scoped to node-to-node
// calls). The receiver accepts an envelope only when all of these hold:
//
//   1. node_security_token is an RS256 JWT whose signature verifies against
//      the cluster's OpenBao Transit key, and it has not expired;
//   2. signature is the Ed25519 signature, by the key the token's node
//      registered, over the signed bytes below;
//   3. issued_at_ms lies within the receiver's freshness window;
//   4. the receiver has not already accepted this node's nonce.
//
// Only then is payload deserialised. The signed bytes are
//
//   "aegis-seal-node/v1" || issued_at_ms (8 bytes, big-endian, two's
//   complement) || len(nonce) (4 bytes, big-endian) || nonce || payload
//
// so the timestamp and nonce cannot be altered without breaking the
// signature.
message SealNodeEnvelope {
  // RS256 JWT issued with the cluster's OpenBao Transit key, by the
  // controller during ChallengeNode or by a joined peer for itself. The
  // header carries `kid`, the Transit key version that signed it.
  // Claims: node_id, role, capabilities_hash, iat, exp; for edge daemons
  // (ADR-117) additionally includes `tid` (persistent tenant binding) and
  // `cep` (controller endpoint advertised at enrollment time).
  string node_security_token = 1;

  // Ed25519 signature over the signed bytes, using the node's private key.
  // Provides non-repudiation: nodes cannot deny issuing a request.
  bytes signature = 2;

  // Serialised inner request message (e.g., RegisterNodeInner, NodeHeartbeatInner).
  // Must be deserialised only after verification succeeds.
  bytes payload = 3;

  // When the sender sealed the envelope, in milliseconds since the Unix epoch.
  int64 issued_at_ms = 4;

  // At least 16 random bytes, never reused by the sender. The receiver
  // refuses a nonce it has already accepted from the same node.
  bytes nonce = 5;
}

// =============================================================================
// Enums
// =============================================================================

// Operational status of a cluster node.
enum NodeStatus {
  NODE_STATUS_UNSPECIFIED = 0;
  // Node is healthy and accepting new executions.
  NODE_STATUS_ACTIVE = 1;
  // Node is finishing in-flight executions and will not accept new ones.
  NODE_STATUS_DRAINING = 2;
  // Node failed its last health check; the scheduler will not route to it.
  NODE_STATUS_UNHEALTHY = 3;
}

// Functional role of a cluster node.
enum NodeRole {
  NODE_ROLE_UNSPECIFIED = 0;
  // Manages routing, registration, and config distribution; does not run executions.
  NODE_ROLE_CONTROLLER = 1;
  // Runs agent executions; does not perform routing decisions.
  NODE_ROLE_WORKER = 2;
  // Capable of both controller and worker duties (single-node / dev deployments).
  NODE_ROLE_HYBRID = 3;
  // ADR-117: User-installed daemon enrolled via an EnrollmentToken; tenant-bound
  // via the `tid` claim on its NodeSecurityToken. Connects via a long-lived
  // ConnectEdge stream and is excluded from worker selection.
  NODE_ROLE_EDGE = 4;
  // ADR-117: Multi-tenant SaaS deployment of NodeClusterService specialized for
  // edge enrollment and routing (e.g. relay.myzaru.com). Re-uses every existing
  // entity, repository, and SEAL discipline — not a separate service.
  NODE_ROLE_RELAY_COORDINATOR = 5;
}

// =============================================================================
// Shared Messages
// =============================================================================

// Hardware and runtime capabilities advertised by a worker node.
// Used during attestation, registration, and for routing decisions.
message NodeCapabilities {
  uint32 gpu_count = 1;
  uint32 vram_gb = 2;
  uint32 cpu_cores = 3;
  uint32 available_memory_gb = 4;

  // AEGIS StandardRuntime strings this node supports, e.g., "python:3.11", "node:20".
  repeated string supported_runtimes = 5;

  // Arbitrary key:value tags used for affinity routing, e.g., "gpu:a100", "region:us-west".
  repeated string tags = 6;
}

// Snapshot of a known cluster node; returned by ListPeers.
message NodeInfo {
  string node_id = 1;
  NodeRole role = 2;
  NodeStatus status = 3;
  NodeCapabilities capabilities = 4;

  // "host:port" of this node's NodeClusterService gRPC server.
  string grpc_address = 5;

  google.protobuf.Timestamp last_heartbeat_at = 6;
  google.protobuf.Timestamp registered_at = 7;
}

// =============================================================================
// AttestNode RPC — Handshake Step 1
// =============================================================================

// Unauthenticated bootstrap call: node introduces itself and supplies its
// Ed25519 public key. Controller stores the key candidate and returns a nonce
// that the node must sign to prove key ownership.
message AttestNodeRequest {
  // Stable UUID identifying this node across restarts.
  string node_id = 1;

  NodeRole role = 2;

  // Raw 32-byte Ed25519 public key (not PEM-encoded).
  bytes public_key = 3;

  NodeCapabilities capabilities = 4;

  // "host:port" where this node's gRPC server listens; recorded by the controller
  // for use in RouteExecution responses and ListPeers output.
  string grpc_address = 5;

  // Cluster enrolment token (audit 002 §4.9). Single-use, opaque token of the
  // form "<token_id>.<secret_b64>" issued by the controller's admin path
  // (separate from the attestation surface), bound to this `node_id`. The
  // controller validates the token, atomically marks it redeemed, and pins
  // `node_id → public_key` on first success. Required for all non-edge roles
  // (Worker, Controller, Hybrid). Edge role uses the bootstrap_proof on
  // ChallengeNode instead.
  string enrolment_token = 6;
}

message AttestNodeResponse {
  // 32-byte cryptographically random nonce; the node must sign this in ChallengeNode
  // to prove it controls the private key corresponding to the submitted public_key.
  bytes challenge_nonce = 1;

  // UUID correlating this attestation attempt to the subsequent ChallengeNode call.
  string challenge_id = 2;
}

// =============================================================================
// ChallengeNode RPC — Handshake Step 2
// =============================================================================

message ChallengeNodeRequest {
  // From AttestNodeResponse.challenge_id; links this response to the correct nonce.
  string challenge_id = 1;

  string node_id = 2;

  // Ed25519 signature over the challenge_nonce bytes returned in AttestNodeResponse.
  bytes challenge_signature = 3;

  // ADR-117: Optional bootstrap proof for non-worker roles. For NODE_ROLE_EDGE
  // the daemon attaches the short-lived enrollment JWT (claims: tid, sub, jti,
  // exp, nbf, aud="edge-enrollment", iss, cep). The server validates the
  // signature/audience/expiry/nbf, atomically redeems `jti`, persists the
  // EdgeDaemon row binding node_id ↔ tenant_id, and issues a NodeSecurityToken
  // whose claims include `tid` and `cep`.
  oneof bootstrap_proof {
    string enrollment_token = 4;
  }
}

message ChallengeNodeResponse {
  // RS256 JWT signed by the controller's OpenBao Transit key.
  // Claims include: node_id, role, capabilities_hash, iat, exp.
  // Must be included as node_security_token in all subsequent SealNodeEnvelopes.
  string node_security_token = 1;

  // Token expiry; node should re-attest before this timestamp.
  google.protobuf.Timestamp expires_at = 2;
}

// =============================================================================
// RegisterNode RPC
// =============================================================================

message RegisterNodeRequest {
  // payload must deserialise to RegisterNodeInner after signature verification.
  SealNodeEnvelope envelope = 1;
}

// Plaintext inner payload for RegisterNode; serialised into SealNodeEnvelope.payload.
message RegisterNodeInner {
  string node_id = 1;
  NodeCapabilities capabilities = 2;

  // "host:port" of this node's gRPC server; may differ from what was sent during
  // attestation if the node's address changed (e.g., dynamic IP reassignment).
  string grpc_address = 3;
}

message RegisterNodeResponse {
  bool accepted = 1;

  // UUID identifying the cluster this node has joined.
  string cluster_id = 2;

  // Human-readable confirmation or rejection reason.
  string message = 3;
}

// =============================================================================
// Heartbeat RPC
// =============================================================================

message NodeHeartbeatRequest {
  // payload must deserialise to NodeHeartbeatInner after signature verification.
  SealNodeEnvelope envelope = 1;
}

// Plaintext inner payload for Heartbeat.
message NodeHeartbeatInner {
  string node_id = 1;
  NodeStatus status = 2;

  // Number of agent executions currently running on this node.
  uint32 active_executions = 3;

  // Current free memory in GB; may differ from NodeCapabilities.available_memory_gb
  // which reflects the static total.
  uint32 available_memory_gb = 4;

  // Current CPU utilisation [0.0, 100.0].
  float cpu_utilization_percent = 5;
}

message NodeHeartbeatResponse {
  // Zero or more commands the node must process immediately after receiving this response.
  repeated NodeCommand pending_commands = 1;
}

// A command delivered to a worker via HeartbeatResponse.pending_commands.
// Workers must process all commands before the next heartbeat interval.
message NodeCommand {
  oneof command {
    // Instruct the worker to stop accepting new executions.
    DrainCommand drain = 1;

    // Deliver a config update; worker must apply it and acknowledge via SyncConfig.
    PushConfigCommand push_config = 2;

    // Instruct the worker to shut down gracefully after draining.
    ShutdownCommand shutdown = 3;
  }
}

// Stop accepting new executions; complete all in-flight executions then idle.
message DrainCommand {
  bool drain = 1;
}

// Carry a config payload for the worker to apply.
message PushConfigCommand {
  string config_version = 1;

  // Serialised config delta (format defined by the config subsystem).
  bytes config_payload = 2;
}

// Request graceful shutdown with an explanatory reason (e.g., "maintenance").
message ShutdownCommand {
  string reason = 1;
}

// =============================================================================
// DeregisterNode RPC
// =============================================================================

message DeregisterNodeRequest {
  // payload must deserialise to DeregisterNodeInner after signature verification.
  SealNodeEnvelope envelope = 1;
}

// Plaintext inner payload for DeregisterNode.
message DeregisterNodeInner {
  string node_id = 1;

  // Free-text reason for deregistration, e.g., "graceful_shutdown", "maintenance".
  string reason = 2;
}

message DeregisterNodeResponse {
  // true if the controller accepted the deregistration; false if the node was
  // not found or already deregistered (idempotent — callers may ignore false).
  bool accepted = 1;
}

// =============================================================================
// RouteExecution RPC
// =============================================================================

message RouteExecutionRequest {
  // payload must deserialise to RouteExecutionInner after signature verification.
  SealNodeEnvelope envelope = 1;
}

// Plaintext inner payload for RouteExecution.
message RouteExecutionInner {
  string execution_id = 1;
  string agent_id = 2;

  // Hardware/runtime requirements that the selected worker must satisfy.
  NodeCapabilities required_capabilities = 3;

  // Optional affinity hints; scheduler prefers nodes whose tags contain all listed values.
  repeated string preferred_tags = 4;

  // Tenant slug; used for tenant-aware routing policies.
  string tenant_id = 5;
}

message RouteExecutionResponse {
  // Node ID of the selected worker.
  string target_node_id = 1;

  // "host:50056" — the caller should dial this address to call ForwardExecution.
  string worker_grpc_address = 2;
}

// =============================================================================
// ForwardExecution RPC
// =============================================================================

message ForwardExecutionRequest {
  // payload must deserialise to ForwardExecutionInner after signature verification.
  SealNodeEnvelope envelope = 1;
}

// Plaintext inner payload for ForwardExecution.
message ForwardExecutionInner {
  string execution_id = 1;
  string agent_id = 2;

  // JSON-encoded execution input passed to the agent's bootstrap loop.
  string input = 3;

  string tenant_id = 4;

  // ID of the node that originated (routed) this execution; used for audit trails.
  string originating_node_id = 5;

  // The caller's raw token is never forwarded (ADR-152 D5.5).
  reserved 6;
  reserved "user_security_token";

  // ADR-083: Security context name propagated from the originating node so the
  // worker applies the correct security policy without hardcoding a default.
  string security_context_name = 7;

  // ADR-152 D5.5: the caller as the forwarding node authenticated it at its
  // own entry point, the orchestrator's UserIdentity as JSON; empty for a
  // start no user made (a system context). The forwarding node vouches for
  // it: the envelope's signature covers it, and the receiver accepts it
  // only from an active member under a live lease, for this execution_id.
  string caller_identity_json = 8;

  // When the forwarding node issued this forward, in Unix seconds. The
  // receiver refuses a forward issued more than 60 s from its own clock.
  int64 vouched_at_unix = 9;
}

// ADR-152 D5.5: answered once the receiving node has claimed the execution.
// Its events reach every node through the cluster event relay (D3), not
// through this call. A repeat of a forward already claimed answers the same.
message ForwardExecutionResponse {
  // The node that owns the execution.
  string owner_node_id = 1;
}

// =============================================================================
// SyncConfig RPC
// =============================================================================

message SyncConfigRequest {
  // payload must deserialise to SyncConfigInner after signature verification.
  SealNodeEnvelope envelope = 1;
}

// Plaintext inner payload for SyncConfig.
message SyncConfigInner {
  string node_id = 1;

  // Version string of the config currently applied on this node.
  // Controller compares this against the latest version to determine whether
  // a delta is needed.
  string current_config_version = 2;

  // Tenant slug; scopes config sync to a specific tenant's configuration subset.
  optional string tenant_id = 3;
}

message SyncConfigResponse {
  // true if the node's current_config_version matches the latest; config_delta will be empty.
  bool up_to_date = 1;

  // The version string of the latest config known to the controller.
  string latest_version = 2;

  // Serialised config delta to apply; empty when up_to_date is true.
  bytes config_delta = 3;
}

// =============================================================================
// PushConfig RPC
// =============================================================================

message PushConfigRequest {
  // payload must deserialise to PushConfigInner after signature verification.
  SealNodeEnvelope envelope = 1;
}

// Plaintext inner payload for PushConfig.
message PushConfigInner {
  // UUID of the worker that should apply this config.
  string target_node_id = 1;

  string config_version = 2;

  // Full serialised config payload (not a delta — replaces the node's current config).
  bytes config_payload = 3;
}

message PushConfigResponse {
  // true if the worker accepted and applied the config; false if it was rejected
  // (e.g., parse error or version conflict — worker will surface details via the
  // next Heartbeat).
  bool accepted = 1;
}

// =============================================================================
// ListPeers RPC
// =============================================================================

message ListPeersRequest {
  // payload must deserialise to ListPeersInner after signature verification.
  SealNodeEnvelope envelope = 1;
}

// Plaintext inner payload for ListPeers.
message ListPeersInner {
  // Return only nodes with one of these statuses. Empty slice = no status filter.
  repeated NodeStatus filter_status = 1;

  // Return only nodes with one of these roles. Empty slice = no role filter.
  repeated NodeRole filter_role = 2;
}

message ListPeersResponse {
  // All nodes matching the requested filters.
  repeated NodeInfo nodes = 1;

  // UUID of the cluster as assigned during RegisterNode.
  string cluster_id = 2;
}

// =============================================================================
// Edge Mode (ADR-117)
// =============================================================================

// Inner SEAL envelope (ADR-035) carried inside an EdgeCommand.InvokeTool. The
// outer SealNodeEnvelope on the ConnectEdge stream proves daemon identity
// (node-to-node); this inner envelope carries the originating user / service-
// account principal so the edge daemon can resolve and enforce the named
// SecurityContext locally — identical to what flows from the orchestrator to
// the SEAL Tooling Gateway today.
message SealEnvelope {
  // RS256 JWT representing the originating user or service-account principal.
  string user_security_token = 1;

  // Effective tenant id (post X-Tenant-Id delegation per ADR-100).
  string tenant_id = 2;

  // Named security context (ADR-083) the edge must resolve from its merged
  // hierarchical config and apply to this tool invocation.
  string security_context_name = 3;

  // Tool-call payload (canonical JSON-equivalent structure).
  google.protobuf.Struct payload = 4;

  // Ed25519 signature over the canonicalised envelope, per ADR-035.
  bytes signature = 5;
}

// Capabilities advertised by an edge daemon. Combines daemon-side facts
// (`os`, `arch`, `local_tools`, `mount_points`, `custom_labels`) with an
// embedded NodeCapabilities for hardware/runtime parity with worker nodes.
// `tags` are operator-managed server-side classifiers — they are echoed back
// here for completeness in CapabilityUpdate snapshots but the daemon MUST NOT
// originate them; the EdgeDaemon row is the source of truth for tags and the
// server overwrites this field on read.
message EdgeCapabilities {
  // Operating system identifier ("linux", "darwin", "windows").
  string os = 1;

  // CPU architecture ("x86_64", "aarch64").
  string arch = 2;

  // Local tool dispatchers available on the host (e.g. "shell", "docker",
  // "kubectl"). Used by selectors with `tools=` predicates.
  repeated string local_tools = 3;

  // POSIX mount points the daemon is willing to expose to fs.* tools.
  repeated string mount_points = 4;

  // Daemon-advertised key/value labels (e.g. {"region": "home",
  // "gpu": "rtx-4090"}).
  map<string, string> custom_labels = 5;

  // Operator-managed flat classifiers (e.g. ["prod", "db-host"]). Server-side
  // source of truth — not authored by the daemon.
  repeated string tags = 6;

  // Embedded hardware/runtime capability advertisement (parity with worker
  // nodes).
  NodeCapabilities node_capabilities = 7;
}

// Result of a single InvokeTool dispatch executed on an edge daemon.
message EdgeResult {
  // True if the tool returned successfully (exit_code == 0 and no transport
  // error); false otherwise.
  bool ok = 1;

  // Process exit code for command-style tools. 0 for non-process tools that
  // completed successfully.
  int32 exit_code = 2;

  // Captured stdout (may be empty when streaming via CommandProgress).
  bytes stdout = 3;

  // Captured stderr (may be empty when streaming via CommandProgress).
  bytes stderr = 4;

  // Tool-specific structured result for non-process tools.
  google.protobuf.Struct structured_result = 5;

  // Coarse error classifier ("timeout", "cancelled", "denied",
  // "tool_not_found", "internal", "edge_disconnected"). Empty on success.
  string error_kind = 6;

  // Human-readable error message; empty on success.
  string error_message = 7;
}

// Daemon → server messages on the ConnectEdge stream. The first message MUST
// be `Hello`; subsequent messages may be any other variant.
message EdgeEvent {
  oneof event {
    HelloEvent hello = 1;
    HeartbeatEvent heartbeat = 2;
    CommandResultEvent command_result = 3;
    CommandProgressEvent command_progress = 4;
    CapabilityUpdateEvent capability_update = 5;
  }
}

// First message on a freshly-opened ConnectEdge stream. Carries the daemon's
// SealNodeEnvelope (proving identity), advertised capabilities, and a
// stream_id minted by the daemon for log correlation. `last_seen_command_id`
// is informational — v1 has no replay; the field exists so server-side
// observability can detect command-id gaps after a reconnect.
message HelloEvent {
  SealNodeEnvelope envelope = 1;
  EdgeCapabilities capabilities = 2;
  string stream_id = 3;
  optional string last_seen_command_id = 4;
}

// Per-stream liveness ping (replaces unary Heartbeat for edge daemons).
message HeartbeatEvent {
  SealNodeEnvelope envelope = 1;
  // Number of in-flight tool invocations on this daemon.
  uint32 active_invocations = 2;
}

// Terminal result for a previously-issued InvokeTool command.
message CommandResultEvent {
  SealNodeEnvelope envelope = 1;
  string command_id = 2;
  EdgeResult result = 3;
}

// Streaming chunk for a previously-issued InvokeTool command. Sequence
// numbers are per-command and monotonically increasing; `stderr` flags
// chunks belonging to the stderr stream.
message CommandProgressEvent {
  SealNodeEnvelope envelope = 1;
  string command_id = 2;
  bytes chunk = 3;
  uint32 sequence = 4;
  bool stderr = 5;
}

// Hot capability update; server hot-updates its in-memory view and persists
// on the next heartbeat checkpoint. `tags` on the inner capabilities are
// ignored — operator-managed tags can only be mutated server-side.
message CapabilityUpdateEvent {
  SealNodeEnvelope envelope = 1;
  EdgeCapabilities capabilities = 2;
}

// Server → daemon messages on the ConnectEdge stream.
message EdgeCommand {
  oneof command {
    InvokeToolCommand invoke_tool = 1;
    CancelCommand cancel = 2;
    EdgePushConfigCommand push_config = 3;
    EdgeDrainCommand drain = 4;
    EdgeShutdownCommand shutdown = 5;
  }
}

// Reverse-RPC: invoke a tool on the edge daemon. `command_id` is a UUID minted
// by the dispatcher; the daemon echoes it on every CommandProgressEvent and
// on the terminal CommandResultEvent. The daemon resolves
// `security_context_name` against its local merged config and verifies
// `seal_envelope` before dispatching to a local built-in dispatcher or MCP
// server.
message InvokeToolCommand {
  string command_id = 1;
  string security_context_name = 2;
  SealEnvelope seal_envelope = 3;
  string tool_name = 4;
  google.protobuf.Struct args = 5;
  google.protobuf.Duration deadline = 6;
}

// Cancel a previously-issued InvokeToolCommand. Best-effort; the daemon
// responds with a CommandResultEvent whose `error_kind = "cancelled"` once
// cancellation is observed.
message CancelCommand {
  string command_id = 1;
}

// Push a hierarchical config delta to the daemon (per-tenant overrides,
// security-context changes, etc.).
message EdgePushConfigCommand {
  google.protobuf.Struct merged_config_delta = 1;
}

// Refuse new InvokeTool dispatches; finish in-flight commands.
message EdgeDrainCommand {}

// Drain then exit the daemon process.
message EdgeShutdownCommand {}

// =============================================================================
// RotateEdgeKey RPC (ADR-117)
// =============================================================================

message RotateEdgeKeyRequest {
  // Outer envelope signed by the *current* (old) key — proves authority to
  // rotate. payload deserialises to RotateEdgeKeyInner after signature
  // verification.
  SealNodeEnvelope current_envelope = 1;

  // Raw 32-byte Ed25519 public key to install. Must differ from the current
  // public key on file.
  bytes new_public_key = 2;

  // Ed25519 signature using the *new* private key over a deterministic
  // challenge constructed by the daemon as
  //   sha256("aegis-edge-rotate" || node_id || new_public_key || nonce)
  // — proves possession of the new key. The nonce is conveyed in the inner
  // payload.
  bytes signature_with_new_key = 3;
}

// Plaintext inner payload for RotateEdgeKey; serialised into
// SealNodeEnvelope.payload.
message RotateEdgeKeyInner {
  string node_id = 1;

  // Echoed for binding — must equal RotateEdgeKeyRequest.new_public_key.
  bytes new_public_key = 2;

  // 32-byte rotation nonce mixed into the deterministic challenge.
  bytes nonce = 3;
}

message RotateEdgeKeyResponse {
  // Replacement RS256 JWT bound to new_public_key. The daemon switches to this
  // token on its next outbound envelope; the in-flight ConnectEdge stream is
  // *not* dropped.
  string node_security_token = 1;

  // New token expiry; daemon should re-attest before this timestamp.
  google.protobuf.Timestamp expires_at = 2;

  // Until this timestamp the server will accept envelopes signed by either
  // the old or the new key (overlap window) so any in-flight messages signed
  // before the swap survive. Absent when the old key is hard-revoked
  // immediately.
  optional google.protobuf.Timestamp overlap_until = 3;
}

// =============================================================================
// IssueEnrollmentToken RPC (ADR-117)
// =============================================================================

// Request from a Controller orchestrator (or any caller authorised via
// Bearer JWT) to mint a short-lived edge enrollment token. The relay-coordinator
// is the only deployment that holds the OpenBao policy
// `transit/sign/edge-enrollment-token`, so issuance is centralised here in the
// SaaS topology.
message IssueEnrollmentTokenRequest {
  // JWT `sub` claim — display label for the host. Free-form.
  string issued_to = 1;
}

message IssueEnrollmentTokenResponse {
  string token = 1;

  // RFC3339, byte-for-byte parity with the prior REST shape so Zaru-side
  // types are unchanged.
  string expires_at = 2;
  string controller_endpoint = 3;
  string qr_payload = 4;
  string command_hint = 5;
}

// =============================================================================
// Membership: Probe and Fence (ADR-152 D1, D6)
// =============================================================================

// A node's membership state, as the node itself reports it.
enum MemberState {
  MEMBER_STATE_UNSPECIFIED = 0;
  // Renewing its lease and doing its work.
  MEMBER_STATE_ACTIVE = 1;
  // Finishing its work before it exits; takes no new work.
  MEMBER_STATE_DRAINING = 2;
  // Stopped by a Fence, or by its own lease being superseded; holds nothing.
  MEMBER_STATE_FENCED = 3;
}

message ProbeRequest {
  // payload must deserialise to ProbeInner after signature verification.
  SealNodeEnvelope envelope = 1;
}

// Plaintext inner payload for Probe.
message ProbeInner {
  // The probing node and the incarnation of its process.
  string node_id = 1;
  int64 incarnation = 2;
}

message ProbeResponse {
  // The answering node and the incarnation of its process (one more each
  // time it starts).
  string node_id = 1;
  int64 incarnation = 2;
  MemberState state = 3;

  // When this node last renewed its lease, as it saw the database answer;
  // absent before its first renewal. Peers never compare it with their own
  // clock: a node that answers probes but has stopped renewing is
  // DB-partitioned, not dead (ADR-152 D6).
  google.protobuf.Timestamp last_renewed_at = 4;
}

message FenceRequest {
  // payload must deserialise to FenceInner after signature verification.
  SealNodeEnvelope envelope = 1;
}

// Plaintext inner payload for Fence.
message FenceInner {
  // The node being fenced, and the incarnation the sender judged
  // DB-partitioned. A node running another incarnation is not fenced.
  string target_node_id = 1;
  int64 target_incarnation = 2;

  // Free-text reason, e.g. "db_partition_grace_elapsed".
  string reason = 3;
}

message FenceResponse {
  // true when the named incarnation is now fenced (or already was).
  bool fenced = 1;

  // The incarnation that answered.
  int64 incarnation = 2;
}

// ADR-152 D5.4.
message CancelExecutionRequest {
  // payload must deserialise to CancelExecutionInner after signature
  // verification.
  SealNodeEnvelope envelope = 1;
}

// Plaintext inner payload for CancelExecution.
message CancelExecutionInner {
  string execution_id = 1;
  // The tenant the cancel was authorised for, checked by the owner against
  // the execution's own tenant.
  string tenant_id = 2;
}

message CancelExecutionResponse {
  // true when this node owns the execution and told its supervisor to stop
  // (or it had already ended); false when this node does not own it.
  bool accepted = 1;
}

// ADR-152 D3.
message StreamClusterEventsRequest {
  // payload must deserialise to StreamClusterEventsInner after signature
  // verification.
  SealNodeEnvelope envelope = 1;
}

// Plaintext inner payload for StreamClusterEvents.
message StreamClusterEventsInner {
  // The subscribing node and the incarnation of its process.
  string node_id = 1;
  int64 incarnation = 2;
}

// One event as its origin published it.
message ClusterEventEnvelope {
  // The node and process that published the event.
  string origin_node_id = 1;
  int64 origin_incarnation = 2;
  // One more for every relayed event this process publishes, from 1. A hole
  // tells the subscriber it missed events and must resynchronise.
  uint64 origin_seq = 3;
  // The event's category, e.g. "execution" or "workflow".
  string category = 4;
  // The event, as the orchestrator's DomainEvent serialises to JSON.
  bytes event_json = 5;
}

// ADR-152 D8.
message InvokeEdgeToolRequest {
  // payload must deserialise to InvokeEdgeToolInner after signature
  // verification.
  SealNodeEnvelope envelope = 1;
}

// Plaintext inner payload for InvokeEdgeTool: the dispatch as the
// originating core built it, its tenant already checked against the edge.
message InvokeEdgeToolInner {
  string edge_node_id = 1;
  string tenant_id = 2;
  string tool_name = 3;
  google.protobuf.Struct args = 4;
  string security_context_name = 5;
  // The user's SEAL envelope, which the edge daemon verifies itself.
  SealEnvelope user_seal_envelope = 6;
  google.protobuf.Duration deadline = 7;
}

message InvokeEdgeToolResponse {
  EdgeResult result = 1;
}
